[project]
name = "veloflow"
version = "0.1.0"
description = "Station-level availability forecasts for the Vélib' Métropole bike-sharing network."
readme = "README.md"
authors = [{ name = "Hamza Ouba" }]
license = "MIT"
license-files = ["LICENSE"]
# VéloFlow is an application, not a library: we pin the minor version so that
# development, the collector VM and Docker images all run the same interpreter.
requires-python = ">=3.12,<3.13"
dependencies = [
    "holidays>=0.108",
    "httpx>=0.28.1",
    "lightgbm>=4.6",
    "polars>=2.1.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "scikit-learn>=1.7",
    "tzdata>=2026.6",
]

[project.scripts]
# Installed as a command in the virtual environment: `uv run veloflow-collector`.
veloflow-collector = "veloflow.collector.__main__:main"
veloflow-compact = "veloflow.storage.compaction:main"
veloflow-refresh-school-holidays = "veloflow.context.school_holidays:main"
veloflow-weather-snapshot = "veloflow.weather.snapshot:main"
veloflow-weather-history = "veloflow.weather.history:main"
veloflow-coverage = "veloflow.quality.coverage:main"
veloflow-counters = "veloflow.context.counters:main"
veloflow-backtest = "veloflow.evaluation.report:main"
veloflow-train = "veloflow.models.train:main"
veloflow-predict = "veloflow.serving.live:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# src layout: the package lives in src/veloflow, never importable by accident
# from the repository root.
packages = ["src/veloflow"]

# ---------------------------------------------------------------------------
# Code quality
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle: PEP 8 errors and warnings
    "F",       # pyflakes: unused imports, undefined names
    "I",       # isort: import ordering
    "B",       # flake8-bugbear: likely bugs (mutable defaults, ...)
    "UP",      # pyupgrade: modern Python 3.12 syntax
    "SIM",     # flake8-simplify
    "N",       # pep8-naming
    "D",       # pydocstyle: docstrings on public code
    "PTH",     # use pathlib instead of os.path (robust Windows paths)
    "DTZ",     # forbid naive datetimes: every timestamp must carry a timezone
    "PT",      # flake8-pytest-style
    "RUF",     # ruff-specific rules
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test names already describe intent; docstrings there are optional.
"tests/**" = ["D"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tests", "scripts"]

# scikit-learn ships no type information.
[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",                     # summary of skipped / failed tests
    "--strict-markers",        # typo in a marker name = error
    "--strict-config",         # typo in this config = error
    "--import-mode=importlib", # recommended for the src layout
]
xfail_strict = true
# Any warning raised during tests becomes an error: deprecations surface early.
filterwarnings = ["error"]

[tool.coverage.run]
source = ["veloflow"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]
